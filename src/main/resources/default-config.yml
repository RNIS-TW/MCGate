config:
  # The bind address to listen for Minecraft client connections.
  bind: 0.0.0.0:25565

  # Number of Netty worker threads. 0 (default) = max(4, 2x CPU cores). Every player's connection
  # is pinned to one of these threads for its whole session, so too few threads on a small
  # VPS/container can make lag/stalls appear to hit "half the players" at a time - only takes
  # effect on (re)start, not a live config reload.
  workerThreads: 0

  # Logs every incoming connection at INFO as soon as the handshake is read - host, remote
  # address, whether it's a status ping or a login, and protocol version. Off by default: logins
  # are already logged (see LoginRelayHandler), and status pings from server-list refreshes/
  # scanners can be frequent enough to be noisy. Hot-reloadable, no restart needed.
  logConnections: false

  # Read-only JSON/HTTP status API (routes, backends, live connection/latency stats).
  # Disabled by default - only bind it to a trusted interface.
  api:
    enabled: false
    bind: localhost:8080

  # Accept a PROXY protocol (v1/v2) header at the start of every incoming connection, before the
  # Minecraft handshake - for when MCGate itself sits behind another load balancer/proxy that
  # needs to hand it the real client address (bind above then becomes the load balancer's address,
  # not the public one). Distinct from a route's own `proxyProtocol`, which is MCGate *sending*
  # that header onward to its backend - this is MCGate *receiving* one from whatever's in front of
  # it. Whatever sits in front of MCGate must actually send this header on every connection, or
  # every real client gets dropped as a malformed handshake. Off by default.
  proxyProtocol: false

  routes:
    # Simple 1:1 host -> backend mapping.
    - host: survival.example.com
      backend: 127.0.0.1:25566

    # Optional UDP passthrough for voice mods (Simple Voice Chat and similar) - relayed on the
    # same bind port above, no extra port to open. Resolved the same way as `backend` (DNS
    # caching, $N param substitution from wildcard hosts), but only a single address, since a UDP
    # relay session has no failover/load-balancing concept once it's handed off to a backend.
    - host: voice.example.com
      backend: 127.0.0.1:25566
      voicechat: 127.0.0.1:24454

    # Multiple hostnames routed to the same backend.
    - host: [creative.example.com, creative-alt.example.com]
      backend: 127.0.0.1:25567

    # Wildcard subdomain routing with parameter substitution:
    # abc.wildcard.example.com -> abc.servers.svc:25568
    - host: "*.wildcard.example.com"
      backend: "$1.servers.svc:25568"

    # Multiple backends with a load balancing strategy.
    # Options: sequential (default), random, round-robin, least-connections, lowest-latency
    - host: lobby.example.com
      backend: [127.0.0.1:25569, 127.0.0.1:25570, 127.0.0.1:25571]
      strategy: round-robin
      # How long to cache a backend's status/ping response. Default: 10s. Use -1s to disable.
      cachePingTTL: 60s

    # Fallback status response served when all backends of this route are offline.
    - host: localhost
      backend: 127.0.0.1:25572
      fallback:
        # Supports legacy &-codes and MiniMessage tags (<red>, <gradient:...>, <bold>, <#ff0000>,
        # etc.) - see https://docs.advntr.dev/minimessage/format.html.
        motd: |
          &cServer is offline.
          <gradient:red:gold>Check back later!</gradient>
        version:
          name: "Try again later!"
          protocol: -1
        # Optional server list icon shown for this fallback status. Either a path to an
        # image file (resolved relative to the working directory, base64-encoded automatically)
        # or an already-encoded "data:image/png;base64,..." string. Ideally a 64x64 PNG.
        favicon: icon.png

    # Auto-reconnect shown to 1.20.2+ clients while all backends are offline, instead of a
    # fallback status/kick (VelocityReconnect-style, no separate holding server needed): the
    # player is kept connected to MCGate itself in a minimal waiting world (it reuses the
    # client's own built-in minecraft:overworld dimension, nothing custom to register) and is
    # transparently moved onto the real backend once it's reachable again - no manual reconnect
    # needed. Older clients still just get a kick with `kickMessage`. Disabled by default.
    - host: reconnect.example.com
      backend: 127.0.0.1:25574
      reconnect:
        enabled: true
        # Also hold players for reconnect if this backend drops mid-session, not just on initial
        # connect. Defaults to the same value as `enabled`.
        onMidSessionDrop: true
        # Backoff for backend reconnect attempts while waiting.
        retryInterval: 5s
        maxRetryInterval: 30s
        backoffMultiplier: 2.0
        # How long to hold a player waiting before giving up and kicking them. 0 = unlimited.
        maxWait: 0s
        # All text below defaults to messages.yml (hot-reloadable, shared across every route) -
        # uncomment any of these to override it just for this route.
        # title: "&eServer is currently offline."
        # subtitle: "&7Waiting to reconnect..."
        # attemptSuffix: " (attempt {attempt})"
        # actionBarFrames: ["&7Reconnecting.", "&7Reconnecting..", "&7Reconnecting..."]
        # kickMessage: "&cServer is offline. Please reconnect shortly."
        animationInterval: 500ms

    # Rewrites the handshake's virtual host to match the backend address,
    # useful when backends require a specific domain to accept connections.
    - host: rewrite.example.com
      backend: play.example.com:25565
      modifyVirtualHost: true

    # Sends the PROXY protocol (HAProxy v1) header to the backend so it can
    # see the real client IP. The backend must also be configured to accept it.
    - host: behind-proxy.example.com
      backend: 10.0.0.3:25566
      proxyProtocol: true

    # Higher priority routes are matched before lower ones, regardless of
    # their order in this file. Default priority is 0; ties keep file order.
    # Useful for making a specific host win over an overlapping wildcard.
    - host: "vip.wildcard.example.com"
      backend: 127.0.0.1:25573
      priority: 10

    # Catch-all: routes anything not matched above and shows a fallback
    # status when the backend is unreachable. Kept at a low priority so
    # more specific routes above always get first pick.
    - host: "*"
      backend: 127.0.0.1:25565
      priority: -10
      fallback:
        motd: No server available for this host.
        version:
          name: "Try example.com"
          protocol: -1
