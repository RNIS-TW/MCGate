name: Release (MCGate)

# Manual only - pick a tag/version, this builds every platform in build.sh's TARGETS list and
# publishes them all as assets on a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Created if it doesn't exist yet."
        required: true
      draft:
        description: "Create as a draft release (review before publishing)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors build.sh's TARGETS. macos-latest runners are Apple Silicon (arm64); the Intel
        # macOS target still links natively there (Apple's toolchain ships both arch backends), so
        # only the two Linux-hosted, different-OS-or-libc targets need `cross` (Docker-based).
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package binary
        id: package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mcgate"
          [ -f "$bin" ] || bin="target/${{ matrix.target }}/release/mcgate.exe"
          chmod +x "$bin" 2>/dev/null || true

          stage="mcgate-${{ inputs.tag }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "$bin" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            asset="$stage.zip"
            zip -r "$asset" "$stage"
          else
            asset="$stage.tar.gz"
            tar czf "$asset" "$stage"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create/update release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          files: dist/*
